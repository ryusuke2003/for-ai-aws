name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Secret scan
        run: python scripts/check_no_secrets.py

      - name: Compile
        run: python -m py_compile src/aws_security_snapshot.py scripts/check_no_secrets.py

      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
